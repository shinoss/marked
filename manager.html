<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marked · Bookmarks</title>
  <link rel="icon" href="icons/marked.svg">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="manager.js"></script>
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="manager.html"><img src="icons/marked.svg" alt="" width="28" height="28">Marked</a>
    <button id="all-bookmarks" class="nav-all"><span>All bookmarks</span><span id="total" class="count"></span></button>
    <div class="section-label">Folders<button id="sidebar-add" title="New folder" aria-label="New folder">+</button></div>
    <nav id="folder-tree" aria-label="Bookmark folders"></nav>
  </aside>
  <main>
    <header class="topbar">
      <label class="search"><input id="search" type="search" placeholder="Search all bookmarks…" aria-label="Search all bookmarks" aria-keyshortcuts="/"><span class="search-hint" title="Press / to focus search"><kbd>/</kbd></span></label>
      <div class="transfer"><button id="import">Import</button><button id="export">Export</button></div>
      <input id="import-file" type="file" accept=".html,.htm,.json,text/html,application/json" hidden>
    </header>
    <section class="workspace">
      <nav id="breadcrumbs" aria-label="Breadcrumb"></nav>
      <div class="heading"><h1 id="page-title">All bookmarks</h1><div class="actions"><button id="new-folder">New folder</button><button id="new-bookmark" class="primary">Add bookmark</button></div></div>
      <div class="list-toolbar"><div id="selection-tools"><span id="selection-count"></span><button id="move-selected">Move</button><button id="delete-selected" class="danger-text">Delete</button><button id="clear-selection">Clear</button></div><span id="list-label">Items</span><div class="view-options"><div class="view-switch" role="group" aria-label="Bookmark view"><button id="list-view" aria-pressed="true">List</button><button id="gallery-view" aria-pressed="false">Gallery</button></div><label class="sort">Sort <select id="sort"><option value="default">Saved order</option><option value="title">Name A–Z</option><option value="newest" selected>Newest first</option></select></label></div></div>
      <div class="table-wrap"><table><thead><tr><th class="check-cell"><input id="select-all" type="checkbox" aria-label="Select all displayed bookmarks"></th><th>Name</th><th class="location-column">Location</th><th class="row-actions-heading"><span class="sr-only">Actions</span></th></tr></thead><tbody id="items"></tbody></table></div>
      <div id="empty" hidden><h2>No bookmarks yet</h2><p>Add a bookmark or import your saved collection.</p></div>
      <footer class="workspace-footer"><span id="visible-count"></span></footer>
    </section>
  </main>
  <dialog id="editor"><form id="editor-form"><h2 id="editor-title"></h2><label>Name<input id="edit-name" required maxlength="2000" autocomplete="off"></label><label id="url-field">URL<input id="edit-url" type="url" placeholder="https://example.com" autocomplete="off"></label><label>Folder<select id="edit-parent"></select></label><div id="preview-field" hidden><img id="edit-preview" alt="Page capture preview"><label class="preview-choice"><input id="save-preview" type="checkbox"> Save preview</label><p>Includes visible page content. Stored only in Marked.</p></div><p id="editor-error" class="error" role="alert"></p><div class="dialog-actions"><button type="button" data-close="editor">Cancel</button><button class="primary" type="submit">Save</button></div></form></dialog>
  <dialog id="move-dialog"><form id="move-form"><h2>Move selected items</h2><label>Destination folder<select id="move-parent"></select></label><p id="move-error" class="error" role="alert"></p><div class="dialog-actions"><button type="button" data-close="move-dialog">Cancel</button><button class="primary" type="submit">Move</button></div></form></dialog>
  <dialog id="confirm-dialog"><form method="dialog"><h2 id="confirm-title"></h2><p id="confirm-message"></p><div class="dialog-actions"><button value="cancel">Cancel</button><button id="confirm-accept" value="accept" class="primary">Continue</button></div></form></dialog>
  <div id="toast" role="status" hidden></div>
</body>
</html>
